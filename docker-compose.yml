# ============================================================================
# dsh-plugin — 本地外部服务统一入口（一条命令拉起全部依赖）
# ============================================================================
#   docker compose up -d              # 全量：casdoor + openmeter 计费栈
#   docker compose up -d casdoor      # 只起认证 IdP
#   docker compose logs -f openmeter  # 看某个服务日志
#   docker compose down               # 停止（数据卷保留）
#
# 端口（全部只绑 loopback）：
#   casdoor    127.0.0.1:8001   认证 IdP（宿主 8000 常被占用，见 casdoor-gateway README）
#   casdoor-gateway  127.0.0.1:3080   认证网关公口（GATEWAY_HOST_PORT 可覆盖映射端口）
#   openmeter  127.0.0.1:8888   计费 API（dsh-openmeter 插件的默认 endpoint）
#   nocobase   127.0.0.1:13000  低代码平台（dsh-nocobase 插件的依赖，casdoor OIDC 登录）
#   kafka / clickhouse / postgres / redis 不映射宿主端口，仅在 compose 网络内互通
#
# 不在本文件里（有意为之）：
#   * higress — 官方安装脚本自管容器生命周期，走 services/higress-gateway/install.sh
#   * plane   — dsh-plane 面向 Plane Cloud 或既有自托管实例，无本地依赖
#
# casdoor 首次启动（casdoor 库为空时）读取 init_data.json 种子；重新播种需
# `docker compose down -v && docker compose up -d casdoor`（注意：-v 会连
# openmeter/nocobase 等共享 PG 数据一起清掉）。
#
# openmeter 镜像从源码构建（fork 的 v3 API 是 dsh-openmeter 必需，官方镜像没有）：
# 源码取 /Users/wuyongjun/trea/openmeter（默认值 ../openmeter 相对仓库根解析，
# 可用 OPENMETER_SRC_DIR 覆盖），构建包含其工作区当前状态（Dockerfile.local 的
# COPY . . 会带上未提交改动）。首次构建需数分钟；fork 源码更新后需显式重建：
#   docker compose build openmeter && docker compose up -d
name: dsh

x-openmeter-common: &openmeter-common
  image: dsh-openmeter:local
  build:
    context: ${OPENMETER_SRC_DIR:-../openmeter}
    dockerfile: Dockerfile.local
  restart: unless-stopped
  volumes:
    - ./services/openmeter/openmeter.yaml:/etc/openmeter/config.yaml:ro

services:
  # ---- 认证：Casdoor IdP（casdoor-gateway + dsh-casdoor-auth 的依赖）-------
  # 存储走下方共享 postgres（独立 casdoor 用户/库，app.ini 里配置 DSN）。
  casdoor:
    image: ${CASDOOR_IMAGE:-casbin/casdoor:latest}
    container_name: dsh-casdoor
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    ports:
      # 宿主 8001 → 容器内 8000（casdoor 自身监听 8000 不变）
      - "127.0.0.1:8001:8000"
    environment:
      RUNNING_IN_DOCKER: "true"
    volumes:
      - casdoor-data:/conf
      - ./services/casdoor-gateway/docker/app.ini:/conf/app.conf:ro
      - ./services/casdoor-gateway/docker/init_data.json:/init_data.json:ro

  # 认证网关：挡在宿主 dsh 之前的公口（OIDC 登录 + 会话 + 全量转发）。
  # 凭据经 env_file 透传（services/casdoor-gateway/.env，gitignored，
  # CASDOOR_CLIENT_ID/SECRET 与 casdoor 种子一致）；environment 覆盖 env_file
  # 的监听面（容器内 0.0.0.0:3080，端口映射仍只绑 loopback）。
  # 端口/公网地址参数化：GATEWAY_HOST_PORT 与 GATEWAY_PUBLIC_URL 必须成对
  # 覆盖（redirect URI 与映射端口一致），默认 3080 即正式形态。
  # issuer 内外分离：浏览器可见的 authorize/redirect 走 CASDOOR_ISSUER
  # （宿主位 8001）；网关自身发起的 discovery/token/JWKS 走内部基址
  # CASDOOR_INTERNAL_ISSUER（compose 网络服务名 casdoor:8000，IdP 流量不出网）。
  # upstream 指向 host.docker.internal:38080（dsh 本体留在宿主私口）。
  # 数据面 bind mount：${HOME}/.dsh-casdoor-gateway → /data——会话 SQLite 与
  # Ed25519 身钥直接落宿主目录，容器重建不换钥（JWKS kid 不变），另有宿主
  # 侧可整目录备份的优点；launch-token 通道：dsh-casdoor-auth 插件（宿主
  # 进程）把 webserver launch token 以 0600 写入 ~/.dsh-casdoor-gateway/
  # webserver-token.json，容器网关在 /data/webserver-token.json 读取完成
  # UpstreamAuth cookie 交换——因此容器必须以宿主 uid:gid 运行（见 user）。
  # user 覆盖：镜像默认 USER node（uid 1000），读不了宿主 0600 token 文件、
  # 写不了宿主属主目录；501:20 为本机单机部署值（宿主 uid:gid），跨机器
  # 部署按宿主调整。
  # ⚠ down -v 警告：bind mount 形态下 docker compose down -v 会把 casdoor-data
  # 等命名卷连同 casdoor 种子一起清——禁止 down -v。镜像 slim 无 curl/wget，
  # healthcheck 用 node 内置 fetch（同 nocobase 先例）。
  casdoor-gateway:
    build: { context: ., dockerfile: services/casdoor-gateway/Dockerfile }
    container_name: dsh-casdoor-gateway
    restart: unless-stopped
    # 宿主 uid:gid（本机单机部署值，跨机器按宿主调整）：镜像默认 USER node
    # （uid 1000）读不了宿主 0600 launch token 文件、写不了宿主属主目录。
    user: "501:20"
    depends_on: [casdoor]
    env_file: [./services/casdoor-gateway/.env]
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-3080}:3080"
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: "3080"
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://127.0.0.1:3080}
      DSH_UPSTREAM_URL: http://host.docker.internal:38080
      CASDOOR_ISSUER: http://127.0.0.1:8001
      CASDOOR_INTERNAL_ISSUER: http://casdoor:8000
      GATEWAY_DATA_DIR: /data
    volumes:
      # bind mount（宿主 ~/.dsh-casdoor-gateway → /data）。launch-token 通道：
      # dsh-casdoor-auth 插件（宿主进程）把 webserver launch token 以 0600 写入
      # ~/.dsh-casdoor-gateway/webserver-token.json，容器网关在
      # /data/webserver-token.json 读取完成 UpstreamAuth cookie 交换；会话
      # SQLite 与 Ed25519 身钥也落宿主目录（持久化语义不变，另有宿主侧可
      # 备份的优点）。
      - ${HOME}/.dsh-casdoor-gateway:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---- 计费：OpenMeter fork 栈（dsh-openmeter 插件的依赖）------------------
  kafka:
    image: confluentinc/cp-kafka:8.0.3
    restart: unless-stopped
    environment:
      CLUSTER_ID: dsh-openmeter-kraft
      KAFKA_BROKER_ID: 0
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENERS: INTERNAL://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # meter 由 bootstrap.mjs 在运行期通过 API 创建，topic 随建随有
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - om-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list"]
      interval: 5s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:25.12.3-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: default
      CLICKHOUSE_DB: openmeter
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - om-ch-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://clickhouse:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.7
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "50mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - om-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

  postgres:
    # 单实例多租户：openmeter 与 nocobase 各用独立用户/角色 + 独立库
    # （init 脚本只在数据卷为空时执行；改用户/库后需 down -v 重置）
    image: postgres:14.20-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - om-pg-data:/var/lib/postgresql/data
      - ./services/openmeter/init.sql:/docker-entrypoint-initdb.d/01-openmeter.sql:ro
      - ./services/nocobase/init.sql:/docker-entrypoint-initdb.d/02-nocobase.sql:ro
      - ./services/casdoor-gateway/docker/init.sql:/docker-entrypoint-initdb.d/03-casdoor.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30

  openmeter:
    <<: *openmeter-common
    command: openmeter --address 0.0.0.0:8888 --config /etc/openmeter/config.yaml
    depends_on:
      kafka: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports:
      - "127.0.0.1:8888:8888"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8888/api/v1/debug/metrics"]
      interval: 5s
      timeout: 3s
      retries: 60

  openmeter-sink:
    <<: *openmeter-common
    command: openmeter-sink-worker --config /etc/openmeter/config.yaml
    depends_on:
      kafka: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
      openmeter: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:10000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  openmeter-balance:
    # 余额扣减必需（收银台/门禁读的是 balance-worker 维护的余额）
    <<: *openmeter-common
    command: openmeter-balance-worker --config /etc/openmeter/config.yaml
    depends_on:
      kafka: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
      openmeter: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:10000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  openmeter-billing:
    <<: *openmeter-common
    command: openmeter-billing-worker --config /etc/openmeter/config.yaml
    depends_on:
      kafka: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      postgres: {condition: service_healthy}
      openmeter: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:10000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ---- 低代码平台：NocoBase（dsh-nocobase 插件的依赖）-----------------------
  # 固定版本 tag（不跟 latest 滚动）；数据在 noco-storage 卷。Casdoor 认证插件
  # 源码在 services/nocobase/plugin-auth-casdoor（构建后连同 dist 直挂进容器），
  # APPEND_PRESET_BUILT_IN_PLUGINS 使其在 install/upgrade 时自动启用。
  # PG 复用上方 postgres 单实例，独立 nocobase 用户 + nocobase 库。
  nocobase:
    image: nocobase/nocobase:2.2.2
    container_name: dsh-nocobase
    restart: unless-stopped
    init: true
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      APP_KEY: dsh-nocobase-app-key-2026
      ENCRYPTION_FIELD_KEY: dsh-nocobase-field-key-2026
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: nocobase
      DB_USER: nocobase
      DB_PASSWORD: nocobase
      INIT_ROOT_EMAIL: nocobase-admin@local.dev
      INIT_ROOT_PASSWORD: NocoBase-Admin1
      INIT_ROOT_NICKNAME: NocoBase Admin
      NOCOBASE_DEFAULT_LANGUAGE: zh-CN
      APPEND_PRESET_BUILT_IN_PLUGINS: "@dsh/plugin-auth-casdoor"
    volumes:
      - noco-storage:/app/nocobase/storage
      - ./services/nocobase/plugin-auth-casdoor:/app/nocobase/storage/plugins/@dsh/plugin-auth-casdoor
    ports:
      - "127.0.0.1:13000:80"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:80/__health_check').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  casdoor-data:
  om-pg-data:
  om-kafka-data:
  om-ch-data:
  om-redis-data:
  noco-storage:
