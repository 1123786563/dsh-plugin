appname = casdoor
httpport = 8000
runmode = dev
driverName = postgres
dataSourceName = "user=casdoor password=casdoor host=postgres port=5432 sslmode=disable dbname=casdoor"
; The origin the BROWSER uses to reach casdoor (login page assets).
origin = http://127.0.0.1:8001
; Seed file read on first boot of an empty database.
initDataFile = "./init_data.json"
