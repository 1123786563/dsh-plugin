# Bundle patch applied over the selected DSH profile when this package is
# listed in dsh.profile.bundles. The row id is deployment-local; the package
# name must match package.json.
#
# Defaults need no configuration: the plugin registers the bundled catalog
# under the 'open-design' skill provider. Override customSkillDirs to append
# extra local skill roots, or disable watch for a static catalog.

- insert:
    - id: open-design
      name: 'dsh-open-design'
      # config:
      #   customSkillDirs: []
      #   watch: true
